<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="PingFang SC,Hiragino Sans GB,sans-serif">
<rect width="1000" height="400" fill="#f8fafa"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#0b3b36">黄果树「三天只玩一个瀑布」片区拆分示意</text>
<text x="20" y="56" font-size="13" fill="#6b7280">联票 10 天有效 → 不必一天刷完三大片区 · 本图为自制示意图，非实景照片</text>
<g font-size="13">
<rect x="20" y="86" width="300" height="118" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2.5"/>
<text x="170" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3b36">D1 下午 · 陡坡塘</text>
<text x="170" y="136" text-anchor="middle" fill="#6b7280">官方建议约 2 小时</text>
<text x="170" y="158" text-anchor="middle" fill="#0f766e">《西游记》片尾取景地</text>
<text x="170" y="180" text-anchor="middle" fill="#16a34a">强度最低 · 当热身</text>
<rect x="350" y="86" width="300" height="118" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
<text x="500" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0e7490">D2 上午 · 大瀑布</text>
<text x="500" y="136" text-anchor="middle" fill="#6b7280">官方建议约 3 小时</text>
<text x="500" y="158" text-anchor="middle" fill="#b45309">07:00 第一波入园</text>
<text x="500" y="180" text-anchor="middle" fill="#0e7490">霞客亭俯瞰 + 双程扶梯</text>
<rect x="680" y="86" width="300" height="118" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2.5"/>
<text x="830" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3b36">D3 上午 · 天星桥</text>
<text x="830" y="136" text-anchor="middle" fill="#6b7280">全程 5 小时 → 只走下半程</text>
<text x="830" y="158" text-anchor="middle" fill="#0f766e">银链坠潭瀑布（最出片）</text>
<text x="830" y="180" text-anchor="middle" fill="#991b1b">版本乙可整段砍掉</text>
</g>
<g font-size="13">
<rect x="20" y="226" width="465" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="38" y="250" font-weight="700" fill="#15803d">建议放弃：水帘洞</text>
<text x="38" y="272" fill="#166534">洞内步道狭窄潮湿 · 每日限流 6000 人 · 高峰排队 60–90 分钟</text>
<rect x="515" y="226" width="465" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="533" y="250" font-weight="700" fill="#15803d">该买的代步</text>
<text x="533" y="272" fill="#166534">观光车 50 元（必买）+ 双程扶梯 50 元 + 缆车 10 元</text>
</g>
<g font-size="13">
<rect x="20" y="314" width="960" height="70" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="38" y="338" font-weight="700" fill="#92400e">10 月是平季：水量适中、人少体验好（7–8 月最磅礴但人最多）</text>
<text x="38" y="362" fill="#78350f">必须提前 1–15 天在「安旅通」小程序预约，当日无现场票，每日上限 5 万人；65 周岁以上免门票但仍需买 50 元观光车并预约</text>
</g>
</svg>
