<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="PingFang SC,Hiragino Sans GB,sans-serif">
<rect width="1000" height="440" fill="#f8fafa"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#0b3b36">格凸河「路线一·老少皆宜」动线示意（含游船）</text>
<text x="20" y="56" font-size="13" fill="#6b7280">依据紫云县官方媒体 2026-09-29 发布的双玩法路线整理 · 本图为自制示意图，非实景照片，不代表实际比例</text>
<g font-size="13">
<rect x="20" y="86" width="118" height="54" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="79" y="108" text-anchor="middle" font-weight="700" fill="#0b3b36">景区检票口</text>
<text x="79" y="127" text-anchor="middle" fill="#6b7280">07:30 入园</text>
<rect x="178" y="86" width="118" height="54" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="237" y="108" text-anchor="middle" font-weight="700" fill="#0e7490">观光车</text>
<text x="237" y="127" text-anchor="middle" fill="#6b7280">代步·不走路</text>
<rect x="336" y="86" width="150" height="54" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="411" y="105" text-anchor="middle" font-weight="700" fill="#0b3b36">鹰燕阁观景台</text>
<text x="411" y="124" text-anchor="middle" fill="#b45309">08–09 点看神光</text>
<rect x="526" y="86" width="178" height="54" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="615" y="105" text-anchor="middle" font-weight="700" fill="#0b3b36">大穿洞（燕子洞）</text>
<text x="615" y="124" text-anchor="middle" fill="#b45309">每整点·蜘蛛人攀岩</text>
<rect x="744" y="86" width="236" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="862" y="105" text-anchor="middle" font-weight="700" fill="#1d4ed8">游船 · 格凸河</text>
<text x="862" y="124" text-anchor="middle" fill="#6b7280">夹山一线天 + 悬棺洞葬</text>
<rect x="744" y="200" width="236" height="68" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="862" y="222" text-anchor="middle" font-weight="700" fill="#0b3b36">大河苗寨</text>
<text x="862" y="240" text-anchor="middle" fill="#6b7280">苗王剑 · 天赐湖（变色湖）</text>
<text x="862" y="258" text-anchor="middle" fill="#b45309">12:30/14:30/16:30 上刀山下火海</text>
<rect x="490" y="200" width="214" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="597" y="229" text-anchor="middle" font-weight="700" fill="#1d4ed8">坐船返程</text>
<text x="597" y="250" text-anchor="middle" fill="#6b7280">原路水上折返</text>
<rect x="286" y="200" width="162" height="68" rx="8" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="367" y="229" text-anchor="middle" font-weight="700" fill="#0b3b36">大穿洞码头</text>
<text x="367" y="250" text-anchor="middle" fill="#6b7280">登岸拾阶而上</text>
<rect x="100" y="200" width="144" height="68" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="172" y="229" text-anchor="middle" font-weight="700" fill="#0e7490">观光车返程</text>
<text x="172" y="250" text-anchor="middle" fill="#6b7280">→ 景区出入口</text>
</g>
<g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#a)">
<path d="M138 113 H176"/><path d="M296 113 H334"/><path d="M486 113 H524"/><path d="M704 113 H742"/>
<path d="M862 140 V198"/><path d="M744 234 H706"/><path d="M490 234 H450"/><path d="M286 234 H246"/>
</g>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
<g font-size="13">
<rect x="20" y="310" width="960" height="112" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="38" y="334" font-weight="700" fill="#92400e">这条动线的关键：全程以平缓步道、观光车、游船为主，几乎无陡峭山路，步行强度极低</text>
<text x="38" y="358" fill="#78350f">· 蓝色两段是游船（去程 + 返程），是全线最省力也最出景的部分：两岸奇峰罗列、岩壁陡峭</text>
<text x="38" y="380" fill="#78350f">· 唯一需要爬的是鹰燕阁观景台前的一段楼梯，以及大穿洞码头登岸的台阶 —— 都很短</text>
<text x="38" y="402" fill="#991b1b">· 对照：另一条「硬核徒步」线要经通天栈道 / 盲谷 / 穿上洞，全程石阶、坡度大，带老人绝对不要选</text>
</g>
</svg>
