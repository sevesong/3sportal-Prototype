<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="PingFang SC,Hiragino Sans GB,sans-serif">
<rect width="1000" height="300" fill="#f8fafa"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#0b3b36">「安顺西进 / 贵阳北出」为什么能把返程票从两张变成一张</text>
<text x="20" y="56" font-size="13" fill="#6b7280">车次与余票为 12306 实时查询（2026-10-03）· 本图为自制示意图</text>
<g font-size="13">
<rect x="20" y="86" width="300" height="76" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="38" y="110" font-weight="700" fill="#991b1b">❌ 走铁路回：要买两段</text>
<text x="38" y="132" fill="#7f1d1d">安顺西 → 贵阳北（10/6 中午仅零星有票）</text>
<text x="38" y="152" fill="#7f1d1d">+ 贵阳北 → 宜宾西　两段都抢到才成立</text>
<rect x="350" y="86" width="630" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="368" y="110" font-weight="700" fill="#15803d">✅ 最后一段走公路：只买一张高铁票</text>
<text x="368" y="132" fill="#166534">景区/紫云/安顺市区 →（包车 1.5–2.5 小时）→ 贵阳北 → 宜宾西</text>
<text x="368" y="152" fill="#166534">贵阳北 10/6 余量宽松：G2188 16:15（商务 3 / 一等 13）、G8712 16:52（一等 16）、C5990 18:57（一等 14 / 二等 20）</text>
</g>
<g font-size="13">
<rect x="20" y="186" width="960" height="96" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
<text x="38" y="210" font-weight="700" fill="#0b3b36">去程（10/4 宜宾西出发，9 班、二等与一等都有票）</text>
<text x="38" y="234" fill="#374151">G8761 07:56 → 10:32 安顺西（2h36）　|　G2837 08:45 → 11:09 安顺西（2h24，推荐）　|　G2865 10:15 → 12:42 安顺西（2h27）</text>
<text x="38" y="260" fill="#6b7280">线路 D 兴义为唯一例外：去程 G8761 07:56 → 11:59 兴义南（4h03）直达，但返程必须兴义南→贵阳北→宜宾西两段买</text>
</g>
</svg>
