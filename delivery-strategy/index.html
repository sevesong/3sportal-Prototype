function anyRuleHas(k){return form.aiLayerBreakthrough.custom_rules.some(r=>r[k]===1);}
function actState(rule,a){
  const dims=(rule.rule_items||[]).map(i=>i.dimension);
  if(a.k==='change_pid'&&anyRuleHas('disable_pid')&&rule.disable_pid!==1) return{dis:1,why:''};
  if(a.k==='disable_pid'){
    if(rule.rule_type!=='index'||!dims.includes('pid')) return{dis:1,why:''};
    if(anyRuleHas('change_pid')&&rule.change_pid!==1) return{dis:1,why:''};
  }
  if(a.k==='change_mob'&&!isM6()) return{dis:1,why:''};
  if(a.k==='change_appoint_mob'){
    if(rule.rule_type!=='index'||!dims.includes('mob')) return{dis:1,why:''};
    if(rule.delete_mob===1) return{dis:1,why:''};
  }
  if(a.k==='delete_mob'){
    if(rule.rule_type!=='index'||!dims.includes('mob')) return{dis:1,why:''};
    if(rule.change_appoint_mob===1) return{dis:1,why:''};
  }
  /* 掐停Channel：指标规则仅当检查对象选中 channel 时可勾选；定时规则不限制（文档 3.7.3） */
  if(a.k==='stop_channel'&&rule.rule_type==='index'&&!dims.includes('channel')) return{dis:1,why:''};
  if(a.k==='block_click'&&rule.cancel_block_click===1) return{dis:1,why:''};
  if(a.k==='cancel_block_click'&&rule.block_click===1) return{dis:1,why:''};
  return{dis:0,why:''};
}

/* 阻断性问题：必填缺失，保存必须拦住 */
function ruleBlockers(r){
  const e=[];
  if(!ACTIONS.some(a=>r[a.k]===1)) e.push('');
  if(r.rule_type==='timing'){
    if(!r.start_date) e.push('');
    if(!r.periods) e.push('');
    if(r.change_start>r.change_end) e.push('');
  }else{
    if(!r.unit||!r.periods) e.push('');
    if(!r.rule_items||!r.rule_items.length) e.push('');
    (r.rule_items||[]).forEach((it,n)=>{
      if(!it.unit||!it.periods) e.push('');
      if(!it.index) e.push('');
      if(it.threshold==null||it.threshold==='') e.push('');
      if(it.dimension==='channel'&&!it.channel_uuid) e.push('');
    });
  }
  if((r.block_click===1||r.cancel_block_click===1)&&!r.block_channel_uuid) e.push('');
  if(r.stop_channel===1&&r.rule_type==='timing'&&!r.block_channel_uuid) e.push('');
  return e;
}
/* 提示性问题：规则本身合法，但依赖当前环境已失效 —— 计入「设置无效」，不拦保存 */
function ruleWarns(r){
  const e=[];
  if(r.change_mob===1&&!isM6()) e.push('');
  (r.rule_items||[]).forEach((it,n)=>{
    if(it.scope===1&&form.crossOfferBt.open_cross_bt!==1)
      e.push('');
  });
  if((r.block_click===1||r.cancel_block_click===1)&&r.block_channel_uuid&&!CHANNELS.includes(r.block_channel_uuid))
    e.push('');
  (r.rule_items||[]).forEach((it,n)=>{
    if(it.dimension==='channel'&&it.channel_uuid&&!CHANNELS.includes(it.channel_uuid))
      e.push('');
  });
  return e;
}
/* 占位符未生效校验（文档 3.7.3）：不拦保存，仅置未生效 */
function ruleMarcoWarns(r){
  const L=form.offer_tracking_link||'',e=[];
  if(r.change_c===1&&!CHANGE_C_MARCOS.some(x=>L.indexOf(x.marco)>=0)) e.push(RULE_INVALID.change_c);
  if(r.disable_pid===1&&L.indexOf('{@info.random_pid()@}')<0) e.push(RULE_INVALID.disable_pid);
  if(r.change_pid===1&&L.indexOf('{@info.change_pid()@}')<0) e.push(RULE_INVALID.change_pid);
  return e;
}
function ruleErrors(r){return ruleBlockers(r).concat(ruleWarns(r)).concat(ruleMarcoWarns(r));}

function badge(s){
  const c=form.chnValueManagement;
  /* 1. BT Mob号设置：展示当前生效配置项 */
  if(s.hash==='chnValueManagement') return{t:MODE[c.mode],cls:'ok'};
  /* 2. 跨offer BT：未开启 / 生效中 */
  if(s.hash==='crossOfferBt'){
    if(!isM6()||form.crossOfferBt.open_cross_bt!==1) return{t:'未开启',cls:''};
    return{t:'生效中',cls:'ok'};
  }
  /* 3. 包名和素材透传：未开启 / 包名透传生效中 · 素材透传生效中 */
  if(s.hash==='transparency'){
    const t=form.transparency,on=[];
    if(isM6()&&t.post_package_status==='enabled') on.push('包名透传生效中');
    if(isM6()&&t.post_package_status==='enabled'&&t.post_creative_status==='enabled') on.push('素材透传生效中');
    return on.length?{t:on.join(' · '),cls:'ok'}:{t:'未开启',cls:''};
  }
  /* 4. Alpha Config：未开启 / 掐尾量生效中 · Reject补发生效中 */
  if(s.hash==='alphaConfig'){
    const a=form.alphaConfig,on=[1,2].filter(k=>a[k]).map(k=>ALPHA_TASK[k]+'生效中');
    return on.length?{t:on.join(' · '),cls:'ok'}:{t:'未开启',cls:''};
  }
  /* 5. 自定义规则配置：无生效规则 / N 条规则生效中 */
  const n=form.aiLayerBreakthrough.custom_rules.filter(r=>r.enabled).length;
  return n?{t:n+' 条规则生效中',cls:'ok'}:{t:'无生效规则',cls:''};
}
function deadRules(){
  const rs=form.aiLayerBreakthrough.custom_rules,out=[];
  const key=i=>[i.dimension,i.scope,i.index,i.caliber,i.symbol,i.periods,i.unit].join('|');
  rs.forEach((r,n)=>{
    if(r.rule_type!=='index'||r.union_condition!=='and'||!r.enabled) return;
    for(let m=0;m<n;m++){
      const p=rs[m];
      if(p.rule_type!=='index'||p.union_condition!=='and'||!p.enabled) continue;
      const pk=p.rule_items.map(key),rk=r.rule_items.map(key);
      if(!pk.length||!pk.every(k=>rk.includes(k))) continue;
      const looser=p.rule_items.every(pi=>{
        const ri=r.rule_items.find(x=>key(x)===key(pi));
        if(!ri) return false;
        if(pi.symbol==='gt'||pi.symbol==='gte') return Number(pi.threshold)<=Number(ri.threshold);
        return Number(pi.threshold)>=Number(ri.threshold);
      });
      if(looser) out.push({i:n,by:m});
    }
  });
  return out;
}

function copyOffers(el,src){
  const arr=(src==='dw'&&dw?dw.d.bindListArr:form.crossOfferBt.bindListArr)||[];
  const txt=arr.join(',');
  /* file:// 下 navigator.clipboard 可能被禁用，先走 execCommand 兜底再尝试异步 API */
  let done=false;
  try{
    const ta=document.createElement('textarea');ta.value=txt;
    ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();
    done=document.execCommand('copy');ta.remove();
  }catch(e){}
  if(!done){
    try{ if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt); }catch(e){}
  }
  if(el){const o=el.textContent;el.textContent='\u2713';setTimeout(()=>{el.textContent=o;},1200);}
  return txt;
}

/* ===== 模块4：Alpha Config（独立模块，逻辑复刻 /dist3/tools/alphaConfig） ===== */
function alphaCfgText(t){
  if(!t) return '<span class="gray">未配置</span>';
  const chn=t.dist_channel_type===2
    ? ((t.dist_channel_uuid||[]).length
        ? (t.dist_channel_uuid||[]).map(x=>'<span class="tag mono">'+esc(x)+'</span>').join('')
        : '<span class="tag r">未选 Channel</span>')
    : '<span class="tag">默认</span>';
  const items=[];
  if(t.task_type===1){
    items.push(['轮次',t.loop==null||t.loop===''?'<span class="tag r">未填</span>':'<b>'+t.loop+'</b>']);
    items.push(['频次',t.scope==null||t.scope===''?'<span class="tag r">未填</span>':'<b>'+t.scope+'</b> h']);
  }else{
    items.push(['时间范围',t.scope==null||t.scope===''?'<span class="tag r">未填</span>':'<b>'+t.scope+'</b> h']);
    const rr=(t.reject_reasons||[]).filter(Boolean);
    items.push(['Reject Reason',rr.length?rr.map(x=>'<span class="tag mono">'+esc(x)+'</span>').join(''):'<span class="tag r">未填</span>']);
  }
  items.push(['目标渠道',chn]);
  return il(items);
}
function alphaState(t){
  if(!t) return ST_IDLE;
  return t.status==='异常'?'<span class="tag r">未生效</span>':ST_ON;
}
function alphaOps(k,t){
  if(!t) return '<div class="opv"><a onclick="alphaEdit('+k+',1)">配置</a></div>';
  return '<div class="opv"><a onclick="alphaEdit('+k+',0)">编辑</a>'
    +(t.status==='异常'?'<a onclick="alphaRetry('+k+')">重新触发</a>':'')
    +'<a class="d" onclick="alphaDel('+k+')">删除</a></div>';
}
function cardAlpha(){
  const a=form.alphaConfig;
  const rows=[1,2].map(k=>'<tr class="'+(a[k]?'':'dim')+'">'
    +'<td>'+ALPHA_TASK[k]+'</td>'
    +'<td class="small gray">'+ALPHA_SCENE[k]+'</td>'
    +'<td>'+alphaCfgText(a[k])+'</td>'
    +'<td>'+alphaState(a[k])+'</td>'
    +'<td>'+alphaOps(k,a[k])+'</td></tr>').join('');
  return '<div class="card" id="alphaConfig"><div class="h">Alpha Config<div class="r">'
    +'<button class="btn sm" onclick="openRecord(\'alpha\')">变更日志</button></div></div>'
    +'<div class="b"><table class="t"><thead><tr>'
    +'<th style="width:150px">配置项</th><th style="width:120px">适用场景</th>'
    +'<th>当前配置</th><th style="width:104px">状态</th><th style="width:150px">操作</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="tip">一个 Offer 下每个配置项仅保留一条记录；Offer 固定为当前 Offer，参数范围与校验逻辑与原 Alpha Config 页一致；配置/重新触发时走新的 s2s 对接逻辑。</div>'
    +'</div></div>';
}
function alphaEdit(k,isNew){
  const cur=form.alphaConfig[k];
  dw={type:'alpha',isNew:!!isNew||!cur,key:+k,d:cur?cp(cur):{
    id:++uid,offer_uuid:form.offer_uuid,task_type:+k,
    loop:null,scope:null,dist_channel_type:null,dist_channel_uuid:[],
    reject_reasons:+k===2?['']:[],status:'正常'}};
  dwRender();
}
function alphaDel(k){
  confirmBox('确认删除 '+ALPHA_TASK[k]+' 配置 ?','',()=>{
    form.alphaConfig[k]=null;mark();closeLayer();render();toast('Success to Remove！');});
}
function alphaRetry(k){
  /* 与线上一致：即时调接口重新触发，不进入保存流程 */
  form.alphaConfig[k].status='正常';
  if(snapshot.alphaConfig&&snapshot.alphaConfig[k]) snapshot.alphaConfig[k].status='正常';
  mark();render();toast('已重新触发（走新 s2s 对接逻辑）');
}
function alphaErrors(d){
  const e=[];
  if(d.task_type===1){
    if(d.loop==null||d.loop===''||d.loop<1||d.loop>7) e.push('请输入1-7整数');
    if(d.scope==null||d.scope===''||d.scope<6||d.scope>168) e.push('请输入6-168整数');
  }else{
    if(d.scope==null||d.scope===''||d.scope<24||d.scope>168) e.push('请输入24-168整数');
    if(!(d.reject_reasons||[]).length||(d.reject_reasons||[]).some(x=>!x)) e.push('Reject Reason 不为空!');
  }
  if(d.dist_channel_type!==1&&d.dist_channel_type!==2) e.push('请选择目标渠道');
  if(d.dist_channel_type===2&&!(d.dist_channel_uuid||[]).length) e.push('请选择Channel Uuid');
  return e;
}
function dwAlpha(){
  const d=dw.d,tt=d.task_type,err=alphaErrors(d);
  const has=m=>err.includes(m);
  let h='<div class="sec"><div class="sh">基本信息</div><div class="sb">'
   +'<div class="fi"><label>Offer:</label><div class="c mono">'+esc(d.offer_uuid)
     +' <span class="tag gray">当前 Offer</span></div></div>'
   +'<div class="fi"><label>配置项:</label><div class="c"><span class="tag">'+ALPHA_TASK[tt]+'</span>'
     +'<span class="small gray" style="margin-left:8px">一个 Offer 下该配置项仅一条记录，Offer 与配置项不可修改</span></div></div>'
   +'</div></div>';

  if(tt===1){
    h+='<div class="sec"><div class="sh">掐尾量参数</div><div class="sb">'
     +'<div class="fi"><label>轮次'+ii(ALPHA_TIP.loop)+':</label><div class="c"><div class="row">'
       +'<input type="number" min="1" max="7" style="width:220px" placeholder="请输入 1~7 之间的整数" value="'
       +(d.loop==null?'':d.loop)+'" oninput="dw.d.loop=this.value===\'\'?null:+this.value;dwRender()">'
       +(has('请输入1-7整数')?'<span class="tag r">请输入1-7整数</span>':'')+'</div></div></div>'
     +'<div class="fi"><label>频次'+ii(ALPHA_TIP.scope)+':</label><div class="c"><div class="row">'
       +'<input type="number" min="6" max="168" style="width:220px" placeholder="请输入 6~168 之间的整数" value="'
       +(d.scope==null?'':d.scope)+'" oninput="dw.d.scope=this.value===\'\'?null:+this.value;dwRender()"'
       +' onblur="alphaClampScope(6,168)"><span class="small">h</span>'
       +(has('请输入6-168整数')?'<span class="tag r">请输入6-168整数</span>':'')+'</div>'
       +'<div class="tip">失焦时越界自动纠正到边界值，与原页面一致。</div></div></div>'
     +'</div></div>';
  }else{
    h+='<div class="sec"><div class="sh">Reject 补发参数</div><div class="sb">'
     +'<div class="fi"><label>时间范围'+ii(ALPHA_TIP.range)+':</label><div class="c"><div class="row">'
       +'<input type="number" min="24" max="168" style="width:220px" placeholder="请输入 24~168 number" value="'
       +(d.scope==null?'':d.scope)+'" oninput="dw.d.scope=this.value===\'\'?null:+this.value;dwRender()"'
       +' onblur="alphaClampScope(24,168)"><span class="small">h</span>'
       +(has('请输入24-168整数')?'<span class="tag r">请输入24-168整数</span>':'')+'</div></div></div>';
    (d.reject_reasons||[]).forEach((rr,n)=>{
      h+='<div class="fi"><label>Reject Reason '+n+':</label><div class="c"><div class="row">'
       +'<select style="width:320px" onchange="dw.d.reject_reasons['+n+']=this.value;dwRender()">'
       +'<option value="">请选择 Reject Reason</option>'
       +REJECT_REASONS.map(x=>'<option value="'+x.id+'" '+(rr===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')
       +'</select>'
       +((d.reject_reasons||[]).length>1?'<button class="btn lnk dgr" onclick="alphaRrDel('+n+')">删除</button>':'')
       +(n+1===(d.reject_reasons||[]).length?'<button class="btn lnk" onclick="alphaRrAdd()">+ 添加</button>':'')
       +(!rr?'<span class="tag r">Reject Reason 不为空!</span>':'')
       +'</div></div></div>';
    });
    h+='</div></div>';
  }

  const cu=d.dist_channel_uuid||[];
  h+='<div class="sec"><div class="sh">目标渠道</div><div class="sb">'
   +'<div class="seg">'+Object.keys(ALPHA_DIST).map(k=>'<button class="'+(d.dist_channel_type==+k?'on':'')
     +'" title="'+esc(ALPHA_DIST_TIP[tt][k]||'')+'" onclick="alphaSetDist('+k+')">'+ALPHA_DIST[k]+'</button>').join('')+'</div>'
   +(has('请选择目标渠道')?'<span class="tag r" style="margin-left:8px">请选择目标渠道</span>':'')
   +'<div class="tip">默认：'+esc(ALPHA_DIST_TIP[tt][1])+'</div>';
  if(d.dist_channel_type===2){
    h+='<div class="row" style="margin-top:10px">'+(cu.length
        ? cu.map((x,i)=>'<span class="tag mono">'+esc(x)+' <a onclick="alphaChnRm('+i+')">×</a></span>').join('')
        : '<span class="gray">未选择 Channel Uuid</span>')+'</div>'
     +'<div class="row" style="margin-top:8px">'
     +'<select style="width:220px" onchange="alphaChnAdd(this.value);this.value=\'\'">'
     +'<option value="">请选择Channel Uuid</option>'
     +CHANNELS.filter(c=>!cu.includes(c)).map(c=>'<option>'+c+'</option>').join('')+'</select>'
     +(has('请选择Channel Uuid')?'<span class="tag r">请选择Channel Uuid</span>':'')+'</div>';
  }
  h+='</div></div>';
  return h;
}
function alphaClampScope(min,max){
  const d=dw.d;if(d.scope==null||d.scope==='')return;
  if(d.scope<min)d.scope=min;if(d.scope>max)d.scope=max;dwRender();
}
function alphaSetDist(k){dw.d.dist_channel_type=+k;if(+k!==2)dw.d.dist_channel_uuid=[];dwRender();}
function alphaChnAdd(v){if(!v)return;const a=dw.d.dist_channel_uuid=dw.d.dist_channel_uuid||[];
  if(!a.includes(v))a.push(v);dwRender();}
function alphaChnRm(i){dw.d.dist_channel_uuid.splice(i,1);dwRender();}
function alphaRrAdd(){dw.d.reject_reasons.push('');dwRender();}
function alphaRrDel(n){dw.d.reject_reasons.splice(n,1);dwRender();}

/* ===== 模块级抽屉 ===== */
let dw=null;
function dwOpen(type){
  const a=form.aiLayerBreakthrough;
  if(type==='chn')  dw={type,d:cp(form.chnValueManagement),scs:null,mob:null};
  if(type==='bt')   dw={type,d:cp(form.crossOfferBt)};
  if(type==='tr')   dw={type,d:cp(form.transparency)};
  if(type==='exec') dw={type,d:{repeat_check:cp(a.repeat_check),pid_list:a.pid_list,disabled_pid_list:cp(a.disabled_pid_list)}};
  dwRender();
}
function dwClose(){dw=null;closeLayer();}
const DW_TITLE={chn:'编辑 BT Mob号设置',bt:'编辑 跨offer BT',tr:'编辑 包名和素材透传',exec:'编辑 执行参数（重复执行检测 / Pid 列表）'};
function dwTitle(){
  if(dw.type==='alpha') return (dw.isNew?'配置':'编辑')+' Alpha Config · '+ALPHA_TASK[dw.d.task_type];
  return DW_TITLE[dw.type];
}
function dwRender(){
  if(!dw) return closeLayer();
  const body=dw.type==='chn'?dwChn():dw.type==='bt'?dwBt():dw.type==='tr'?dwTr()
    :dw.type==='alpha'?dwAlpha():dwExec();
  const err=dwErrors();
  $('#layer').innerHTML='<div class="mask" onclick="if(event.target===this)dwClose()"></div><div class="dwr">'
   +'<div class="h"><b>'+esc(dwTitle())+'</b><button class="btn sm" onclick="dwClose()">关闭</button></div>'
   +'<div class="b">'+body+'</div>'
   +'<div class="f"><div></div>'
   +'<div class="row"><button class="btn" onclick="dwClose()">取消</button>'
   +'<button class="btn pri" '+(err.length?'disabled':'')+' onclick="dwApply()">保存</button></div></div></div>';
}
function dwErrors(){
  const e=[],d=dw.d;
  if(dw.type==='alpha') return alphaErrors(d);
  if(dw.type==='chn'){
    if(d.mode===6&&lines(d.subidListStr).length>500) e.push('');
    if((d.mode===1||d.mode===2)&&!d.special_channel_setting.length) e.push('');
  }
  if(dw.type==='bt'){
    if(d.open_cross_bt===1&&!d.bindListArr.length) e.push('');

  }
  if(dw.type==='tr'&&d.post_package_status==='enabled'&&d.post_package_type===2
    &&(d.no_banding_rate==null||d.no_banding_rate==='')) e.push('');
  if(dw.type==='exec'){
    const r=d.repeat_check;
    if(r.check_pid===1&&!r.check_pid_hour) e.push('');
    if(r.check_c===1&&!r.check_c_hour) e.push('');
    const ps=lines(d.pid_list);
    if(!anyRuleHas('disable_pid')&&ps.length!==new Set(ps).size) e.push('');
  }
  return e;
}

/* --- 抽屉：Channel Value Management --- */
function dwChn(){
  const d=dw.d;
  let h='<div class="sec"><div class="sh">General Channel Setting</div><div class="sb">'
   +'<div class="seg">'+[6,1,2].map(k=>'<button class="'+(d.mode===k?'on':'')+'" onclick="dwSetMode('+k+')">'
     +MODE[k]+ii(MODE_SCENE[k])+'</button>').join('')+'</div>'
   +'</div></div>';

  if(d.mode===1||d.mode===2){
    h+='<div class="sec"><div class="sh">Special Channel Setting'
     +'<span style="display:flex;gap:4px;align-items:center;font-weight:400">'+ii(SCS_TIP)+'<button class="btn sm" onclick="dwScsNew()">+ Add Rule</button></span></div><div class="sb">'

function dwMobRun(){
  const v=lines(dw.mob.text),kind=dw.mob.kind;

  const cur=lines(dw.d.subidListStr),miss=v.filter(x=>!cur.includes(x));

  dw.d.subidListStr=kind==='Delete'

/* --- 抽屉：应用到草稿 --- */
function dwApply(){
  const t=dw.type,d=dw.d;
  if(t==='alpha'){
    const isNew=dw.isNew,k=dw.key;
    if(d.task_type===2) d.reject_reasons=(d.reject_reasons||[]).filter(Boolean);
    if(d.dist_channel_type!==2) d.dist_channel_uuid=[];
    form.alphaConfig[k]=d;
    dw=null;mark();closeLayer();render();
    toast(isNew?'Created successful！':'Updated');
    return;
  }
  if(t==='chn'){
    const old=form.chnValueManagement.mode,affected=[];
    if(old===6&&d.mode!==6){
      if(form.crossOfferBt.open_cross_bt===1) affected.push('跨offer BT（已绑定 '+form.crossOfferBt.bindListArr.length+' 个 offer）将不再生效');
      if(form.transparency.post_package_status==='enabled') affected.push('包名透传配置将不再生效');
      const mo=form.aiLayerBreakthrough.custom_rules.filter(r=>r.change_mob===1||r.change_appoint_mob===1||r.delete_mob===1).length;
      if(mo) affected.push(mo+' 条规则含 Mob 类动作，将失效');
    }
    const go=()=>{(d.special_channel_setting||[]).forEach(r=>r.status='running');
      form.chnValueManagement=d;dw=null;mark();closeLayer();render();toast(SAVED);};
    if(!affected.length) return go();
    return confirmBox('切换传值模式为「'+MODE[d.mode]+'」',
      '<ul style="margin:0 0 0 20px;color:#606266">'
      +affected.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>',go);
  }
  if(t==='bt'){
    const was=form.crossOfferBt.open_cross_bt===1,now=d.open_cross_bt===1;
    const go=()=>{
      BT_SYNC.forEach(x=>d[x.k]=now?1:0);
      form.crossOfferBt=d;
      form.chnValueManagement.disabledSubidEdit=now;
      if(!now){
        form.aiLayerBreakthrough.custom_rules.forEach(r=>(r.rule_items||[]).forEach(i=>{if(i.scope===1)i.scope=0;}));
      }
      dw=null;mark();closeLayer();render();toast(SAVED);};
    if(was&&!now) return confirmBox('关闭跨Offer BT',
      '',go);
    if(!was&&now&&d.bindListArr.some(x=>x.includes('|'))) return confirmBox('跨Offer BT覆盖提示',
      ''
      +'<div class="mono" style="margin-top:8px">'+d.bindListArr.map(esc).join('<br>')+'</div>',go);
    return go();
  }

function execDays(){
  const a=form.aiLayerBreakthrough,out=[];
  for(let i=-7;i<=6;i++){
    const d=new Date(2026,7,10+i),key=fmtd(d);
    const past=(a.executed_report||[]).filter(x=>x.timestamp.slice(0,10)===key);
    const hasTiming=a.custom_rules.some(r=>r.enabled&&r.rule_type==='timing');
    const fut=hasTiming?(a.future_executed_report||[]).filter(x=>x.timestamp.slice(0,10)===key):[];
    out.push({key,label:(d.getMonth()+1)+'/'+d.getDate(),today:i===0,future:i>0,
      ok:past.filter(x=>x.status!=='fail').length,fail:past.filter(x=>x.status==='fail').length,
      plan:fut.length,items:past.map(x=>({...x,kind:x.status==='fail'?'fail':'ok'})).concat(fut.map(x=>({...x,kind:'plan'})))});
  }
  return out;
}
function tlBars(){
  const days=execDays(),max=Math.max(1,...days.map(x=>x.ok+x.fail+x.plan)),u=44/max;
  return days.map((x,i)=>(i===7?'<div class="tlsep" title="今天"></div>':'')
    +'<div class="tld'+(x.today?' today':'')+(x.future?' fut':'')+(tlSel===x.key?' sel':'')+'" onclick="tlSel=\''+x.key+'\';render()">'
    +'<div class="tlb">'
      +(x.plan?'<i class="plan" style="height:'+(x.plan*u)+'px"></i>':'')
      +(x.fail?'<i class="fail" style="height:'+(x.fail*u)+'px"></i>':'')
      +(x.ok?'<i class="ok" style="height:'+(x.ok*u)+'px"></i>':'')
    +'</div><span class="tll">'+(x.today?'今天':x.label)+'</span></div>').join('');
}

let scsDraft=null;
function openScs(i){
  const c=form.chnValueManagement;
  scsDraft=i==null?{mode:6,channelUuid:'',subid:'',channelRulesStr:'',subidListStr:''}
   :{idx:i,mode:c.special_channel_setting[i].mode,channelUuid:'',subid:'',
     channelRulesStr:(c.special_channel_setting[i].channel_rules||[]).join('\n'),
     subidListStr:(c.special_channel_setting[i].subid_list||[]).join('\n')};
  renderScs();}
function renderScs(){
  const c=form.chnValueManagement,d=scsDraft;
  const types=Object.keys(MODE).filter(k=>+k===6||+k!==c.mode);
  $('#layer').innerHTML='<div class="mask" onclick="if(event.target===this)closeLayer()"><div class="dlg w770">'
   +'<div class="h">Special Channel Setting: '+(d.idx==null?'Add Rule':'Edit Rule')+'<a onclick="closeLayer()">×</a></div><div class="b">'
   +'<div class="fi"><label>Offer UUID:</label><div class="c mono">'+esc(c.uuid)+'</div></div>'
   +'<div class="fi"><label>Value Type:</label><div class="c"><div class="seg">'
     +types.map(k=>'<button class="'+(d.mode==+k?'on':'')+'" onclick="scsSet(\'mode\','+k+')">'+MODE[k]+'</button>').join('')
   +'</div></div></div>'
   +'<div class="fi"><label>Channel uuid:</label><div class="c"><div class="row">'
     +'<select onchange="scsSet(\'channelUuid\',this.value)" style="width:200px"><option value="">Search</option>'
     +CHANNELS.map(x=>'<option '+(d.channelUuid===x?'selected':'')+'>'+x+'</option>').join('')+'</select>'
     +(d.mode===6?'<span class="small">Subid:</span><input type="text" style="width:180px" value="'+esc(d.subid)
        +'" oninput="scsDraft.subid=this.value"><button class="btn sm" onclick="scsAddRule()">Add Rule</button>':'')
   +'</div></div></div>'
   +(d.mode===6?'<div class="fi"><label>Channel Rules:</label><div class="c">'
     +'<textarea rows="6" oninput="scsDraft.channelRulesStr=this.value">'+esc(d.channelRulesStr)+'</textarea>'
     +'</div></div>'
    +'<div class="fi"><label>Subid List:</label><div class="c">'
     +'<textarea rows="6" oninput="scsDraft.subidListStr=this.value">'+esc(d.subidListStr)+'</textarea>'
     +'<button class="btn sm" style="margin-top:6px" onclick="scsNewSubid()">New Subid</button></div></div>':'')
   +'</div><div class="f"><button class="btn" onclick="closeLayer()">Cancel</button>'
   +'<button class="btn pri" onclick="scsSave()">'+(d.idx==null?'Add':'Save')+'</button></div></div></div>';}
function scsSet(k,v){scsDraft[k]=v;renderScs();}
function scsAddRule(){if(!scsDraft.channelUuid)return;
  const l='channel='+scsDraft.channelUuid+(scsDraft.subid?' & subid='+scsDraft.subid:'');
  scsDraft.channelRulesStr=(scsDraft.channelRulesStr?scsDraft.channelRulesStr+'\n':'')+l;renderScs();}
function scsNewSubid(){scsDraft.subidListStr=(scsDraft.subidListStr?scsDraft.subidListStr+'\n':'')+'mob'+Math.random().toString(16).slice(2,18);renderScs();}
function scsSave(){
  const c=form.chnValueManagement,d=scsDraft;
  if(!d.channelUuid&&!d.channelRulesStr.trim()) return;
  const row={id:d.idx==null?null:c.special_channel_setting[d.idx].id,mode:d.mode,
    channel_rules:lines(d.channelRulesStr).length?lines(d.channelRulesStr):['channel='+d.channelUuid],
    subid_list:lines(d.subidListStr),status:d.idx==null?'create':'edit'};
  if(d.idx==null) c.special_channel_setting.push(row); else c.special_channel_setting[d.idx]=row;
  mark();closeLayer();render();}

function mobSubmit(kind){
  const v=lines($('#mobTa').value);

  const cur=lines(form.chnValueManagement.subidListStr);

  if(miss.length) return confirmBox('Warning','',()=>closeLayer());
  if(kind==='Delete') form.chnValueManagement.subidListStr=cur.filter(x=>!v.includes(x)).join('\n');
  else form.chnValueManagement.subidListStr=cur.map(x=>v.includes(x)?'mob'+Math.random().toString(16).slice(2,18):x).join('\n');
  mark();closeLayer();render();}

/* ===== 规则测试器 ===== */
const SAMPLE={click:1200,install:14,cvr:1.17,ctit:820,reject_rate:34.5,ret_rate:12,revenue:210,cost:180,roi:88,event_rate:6};
function openTester(){
  const a=form.aiLayerBreakthrough;
  let rows='';
  a.custom_rules.forEach((r,i)=>{
    if(!r.enabled){rows+='<tr class="dim"><td>'+(i+1)+'</td><td>'+RULE_TYPE[r.rule_type]+'</td><td class="gray">规则已停用，不参与执行</td><td><span class="tag gray">已停用</span></td></tr>';return;}
    if(r.rule_type==='timing'){rows+='<tr><td>'+(i+1)+'</td><td>定时规则</td><td class="gray">按时间触发，不参与指标模拟</td><td>—</td></tr>';return;}
    const hits=r.rule_items.map(it=>{
      const v=SAMPLE[it.index],ix=idxOf(it.index);
      if(v==null) return{ok:false,txt:'指标未选'};
      const ok=it.symbol==='gt'?v>it.threshold:it.symbol==='gte'?v>=it.threshold:it.symbol==='lt'?v<it.threshold:v<=it.threshold;
      return{ok,txt:(ix?ix.name:'?')+' 实际 '+v+(ix&&ix.is_rate?'%':'')+' '+SYMBOL[it.symbol]+' '+it.threshold+(ix&&ix.is_rate?'%':'')+' → '+(ok?'满足':'不满足')};
    });
    const fire=r.union_condition==='and'?hits.every(x=>x.ok):hits.some(x=>x.ok);
    rows+='<tr><td>'+(i+1)+'</td><td>指标规则</td><td>'+hits.map(x=>'<div class="'+(x.ok?'':'gray')+'">'+esc(x.txt)+'</div>').join('')
     +'</td><td>'+(fire?'<span class="tag g">触发</span><div style="margin-top:4px">'+actTags(r)+'</div>':'<span class="tag gray">不触发</span>')+'</td></tr>';
  });
  $('#layer').innerHTML='<div class="mask" onclick="if(event.target===this)closeLayer()"><div class="dlg w880">'
   +'<div class="h">规则测试器<a onclick="closeLayer()">×</a></div><div class="b">'
   +''
   +'<div class="sent" style="margin:10px 0">'+INDEXES.map(x=>'<span class="small">'+x.name+' '
     +'<input type="number" style="width:80px" value="'+SAMPLE[x.id]+'" oninput="SAMPLE[\''+x.id+'\']=+this.value;openTester()"></span>').join('')+'</div>'
   +'<table class="t"><thead><tr><th style="width:50px">规则</th><th style="width:80px">类型</th><th>条件评估</th><th style="width:30%">结果</th></tr></thead>'
   +'<tbody>'+(rows||'<tr><td colspan="4" class="gray" style="text-align:center;padding:16px">暂无规则</td></tr>')+'</tbody></table>'
   +'</div><div class="f"><button class="btn" onclick="closeLayer()">关闭</button></div></div></div>';}

/* ===== 保存即生效（各模块独立提交，无页面级统一 Save） ===== */
function mark(){Object.assign(snapshot,JSON.parse(JSON.stringify(form)));}
function bindDrag(){
  const tb=document.querySelector('#ruleTbl tbody');if(!tb)return;
  let from=null;
  tb.querySelectorAll('tr[draggable=true]').forEach(tr=>{
    tr.ondragstart=e=>{from=+tr.dataset.i;tr.classList.add('dragging');};
    tr.ondragend=()=>tr.classList.remove('dragging');
    tr.ondragover=e=>e.preventDefault();
    tr.ondrop=e=>{e.preventDefault();const to=+tr.dataset.i;
      if(from==null||from===to)return;
      const rs=form.aiLayerBreakthrough.custom_rules;
      rs.splice(to,0,rs.splice(from,1)[0]);from=null;mark();render();
      };
  });
}
function render(){
  renderCtx();
  let h=cardChn();
  if(isM6()){h+=cardBt();h+=cardTr();}
  h+=cardAlpha();
  h+=cardRules();
  $('#main').innerHTML=h;
  renderNav();bindDrag();
}
/* 进入页面：跑各模块「未生效」校验并刷新列表状态（3.1.1） */
function startupCheck(){
  let n=0;
  form.aiLayerBreakthrough.custom_rules.forEach(r=>{if(r.enabled&&ruleErrors(r).length)n++;});
  if(pkgInvalid().length) n++;
  if(creInvalid().length) n++;
  toast(n?('已完成生效校验：'+n+' 项配置未生效'):'已完成生效校验：全部配置生效中',n?'warn':'');
}
render();mark();setTimeout(startupCheck,300);
