<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3S Create Offer 重构原型 v5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#303133;background:#f5f7fa}
a{cursor:pointer;color:#409eff;text-decoration:none}
.mono{font-family:Menlo,Consolas,monospace;font-size:12px}
.small{font-size:12px}.gray{color:#909399}
.hd{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid #e4e7ed;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hd h1{font-size:16px;font-weight:600}
.ctx{display:flex;gap:6px;align-items:center;font-size:12px;color:#606266;flex-wrap:wrap}
.ctx .kv{background:#f4f4f5;border-radius:3px;padding:2px 8px}
.ctx .kv b{color:#303133;font-weight:500}

/* 主体 + 右侧锚点导航 */
.wrap{display:flex;gap:16px;padding:16px 24px 90px;align-items:flex-start}
.main{flex:1;min-width:0}
.nav{position:sticky;top:60px;width:230px;flex:0 0 230px;background:#fff;border:1px solid #e4e7ed;border-radius:4px;padding:8px;max-height:calc(100vh - 150px);overflow:auto}
.nav .nt{font-size:12px;color:#909399;padding:4px 10px 8px}
.nav .ni{display:block;padding:7px 10px;border-radius:4px;color:#303133;font-size:13px;border-right:3px solid transparent}
.nav .ni:hover{background:#f5f7fa}
.nav .ni.on{background:#ecf5ff;color:#409eff;border-right-color:#409eff;font-weight:500}
.nav .bd{display:block;font-size:11px;margin-top:1px;color:#909399}
.nav .bd.ok{color:#67c23a}.nav .bd.warn{color:#e6a23c}.nav .bd.err{color:#f56c6c}

.card{background:#fff;border:1px solid #e4e7ed;border-radius:4px;margin-bottom:16px}
.card>.h{padding:11px 16px;border-bottom:1px solid #ebeef5;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card>.h .r{display:flex;gap:8px;align-items:center;font-weight:400}
.card>.b{padding:16px}
.card.new{border-color:#b3d8ff}
.card.new>.h{background:#f4f9ff}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#fafafa;padding:8px 10px;border:1px solid #ebeef5;text-align:left;font-weight:500;color:#606266}
table.t td{padding:7px 10px;border:1px solid #ebeef5;vertical-align:middle}
table.t tr.bad td{background:#fef6f6}
table.t td.err{color:#f56c6c}
table.t.sm{font-size:12px}table.t.sm th{padding:5px 7px}table.t.sm td{padding:4px 7px}
table.t input,table.t select{padding:3px 7px;font-size:12px}

.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;background:#ecf5ff;color:#409eff;border:1px solid #d9ecff;margin:1px 3px 1px 0;white-space:nowrap}
.tag.g{background:#f0f9eb;color:#67c23a;border-color:#e1f3d8}
.tag.o{background:#fdf6ec;color:#e6a23c;border-color:#faecd8}
.tag.r{background:#fef0f0;color:#f56c6c;border-color:#fde2e2}
.tag.gray{background:#f4f4f5;color:#909399;border-color:#e9e9eb}
.tag.sel{cursor:pointer}.tag.sel:hover{border-color:#409eff}
.tag.pick{background:#409eff;color:#fff;border-color:#409eff}
.tag.nw{background:#f4f9ff;color:#409eff;border-color:#b3d8ff}

.btn{padding:6px 14px;border:1px solid #dcdfe6;background:#fff;border-radius:4px;cursor:pointer;font-size:13px}
.btn:hover{border-color:#409eff;color:#409eff}
.btn.pri{background:#409eff;border-color:#409eff;color:#fff}
.btn.pri:hover{opacity:.85;color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.lnk{border:0;background:transparent;color:#409eff;padding:2px 4px}
.btn.lt{background:#ecf5ff;border-color:#b3d8ff;color:#409eff}
.btn.lt:hover{background:#d9ecff;border-color:#409eff;color:#409eff}
.opv{display:flex;gap:10px;font-size:12px}

.sw{display:inline-block;width:36px;height:19px;border-radius:10px;background:#dcdfe6;position:relative;cursor:pointer;flex:0 0 auto}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#409eff}.sw.on:after{left:19px}

/* 悬浮注释 */
.ii{display:inline-block;position:relative;width:14px;height:14px;line-height:14px;text-align:center;border-radius:50%;background:#c0c4cc;color:#fff;font-size:10px;font-style:normal;cursor:help;vertical-align:middle;margin-left:4px;flex:0 0 auto}
.ii:hover{background:#409eff}
.ii:after{content:attr(data-tip);position:absolute;left:50%;bottom:150%;transform:translateX(-50%);display:none;white-space:pre-line;width:max-content;max-width:360px;text-align:left;background:#303133;color:#fff;font-size:12px;line-height:1.6;padding:7px 10px;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:400;pointer-events:none}
.ii:hover:after{display:block}
.ii.rt:after{left:auto;right:0;transform:none}
.tip{font-size:12px;color:#909399;display:flex;gap:5px;align-items:flex-start;margin-top:6px}
.tip:before{content:"ⓘ";color:#409eff;flex:0 0 auto}
.tip.err{color:#f56c6c}.tip.err:before{content:"⚠";color:#f56c6c}
.tip.warn{color:#e6a23c}.tip.warn:before{content:"⚠";color:#e6a23c}

/* 模块内部不再套小模块：标题降级为字段分组标题，内容直接平铺 */
.sec{margin:0 0 12px;border:0}
.sec:last-child{margin-bottom:0}
.sec>.sh{padding:8px 0 5px;background:none;border-bottom:1px solid #ebeef5;font-weight:600;font-size:13px;color:#303133;display:flex;justify-content:space-between;align-items:center}
.sec>.sb{padding:10px 0 0}
.sec .sec{margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 字段行：标签左对齐（字段名同一起点）+ 固定宽度控件区（输入框同起同止） */
.fi{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.fi:last-child{margin-bottom:0}
.fi>label{flex:0 0 150px;text-align:left;color:#606266;font-size:13px;padding-top:6px;line-height:1.45}
.fi>label .rq{color:#f56c6c;margin-right:3px}
.fi>.c{flex:1;min-width:0;max-width:339px;position:relative}
.fi>.c>input,.fi>.c>select,.fi>.c>textarea{width:100%}
.fi>.c>.seg{display:flex;width:100%}
.fi>.c>.seg button{flex:1}
/* 正文区不展示任何注释：ⓘ 图标、灰色说明文字、非校验类提示全部不渲染出来 */
#main .ii,#main .tip{display:none}
/* 需要并排放两个控件的行：铺满整行 */
.fi>.c.wide{max-width:none;padding-right:0}
.fi>.c.wide>.ii{position:static;margin-left:4px}
/* 第一列略宽，第二列整体往右一点，不做等分居中 */
.g2{display:grid;grid-template-columns:1.16fr 1fr;gap:0 20px}
/* 两栏并排的子模块（Picture / Video） */
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.g2c>.sec{margin:0}
/* Cap 表居中收窄，别横贯整屏 */
.capw{max-width:1000px;margin:0 auto}
/* 表格内的富文本输入框 */
.rt{min-height:26px;border:1px solid #dcdfe6;border-radius:4px;padding:3px 7px;font-size:12px;line-height:1.5;background:#fff}
.rt:empty:before{content:attr(data-ph);color:#c0c4cc}
.rt:focus{outline:0;border-color:#409eff}
table.t td.ct,table.t th.ct{text-align:center}
table.t td.brk{word-break:break-all}
.seg{display:inline-flex;border:1px solid #dcdfe6;border-radius:4px;overflow:hidden}
.seg button{padding:5px 12px;border:0;border-right:1px solid #dcdfe6;background:#fff;cursor:pointer;font-size:13px}
.seg button:last-child{border-right:0}
.seg button.on{background:#409eff;color:#fff}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;padding:5px 9px;border:1px solid #dcdfe6;border-radius:4px;font-size:13px;font-family:inherit}
textarea.mono{font-family:Menlo,Consolas,monospace;font-size:12px;line-height:1.7}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin:2px 10px 2px 0;cursor:pointer}
.ro{background:#fafafa;border:1px solid #ebeef5;border-radius:4px;padding:10px 12px}
.pv{background:#2d3748;color:#e2e8f0;border-radius:4px;padding:9px 11px;font-family:Menlo,Consolas,monospace;font-size:12px;line-height:1.75;word-break:break-all;white-space:pre-wrap}
.pv em{color:#f6ad55;font-style:normal}
.pv b{color:#68d391;font-weight:400}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#606266;align-items:center}
.sum b{font-size:15px;color:#303133;font-weight:600}

/* 三级 Geo 选择器 */
.geo3{display:grid;grid-template-columns:250px 1fr 1.15fr;border:1px solid #ebeef5;border-radius:4px;overflow:hidden;min-height:390px}
.geo3>div{border-right:1px solid #ebeef5;display:flex;flex-direction:column}
.geo3>div:last-child{border-right:0}
.geo3 .ch{padding:7px 10px;background:#fafafa;border-bottom:1px solid #ebeef5;font-size:12px;color:#606266;display:flex;justify-content:space-between;align-items:center;gap:6px}
.geo3 .cb{flex:1;overflow:auto;max-height:400px}
/* 列表内的分组小标题，用于国家分区与城市批量操作 */
.gg{padding:4px 10px;background:#fafbfc;border-bottom:1px solid #f0f2f5;font-size:11px;color:#909399;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1}
.gi{padding:6px 10px;border-bottom:1px solid #f5f7fa;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.gi:hover{background:#f5f7fa}
.gi.on{background:#ecf5ff;color:#409eff}
.gi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .mt{font-size:11px;color:#909399;flex:0 0 auto}
.gi.on .mt{color:#79bbff}
.srch{margin:0;border:0;border-bottom:1px solid #ebeef5;border-radius:0;padding:6px 10px;font-size:12px}
.srch:focus{outline:0;background:#f5f7fa}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e7ed;padding:9px 24px;display:flex;justify-content:center;align-items:center;z-index:60}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;overflow:auto}
.dlg{background:#fff;border-radius:4px;width:720px;max-width:100%;margin:60px auto}
.dlg.w960{width:960px}
.dlg>.h{padding:13px 18px;border-bottom:1px solid #e4e7ed;font-weight:600;display:flex;justify-content:space-between}
.dlg>.b{padding:18px;max-height:70vh;overflow:auto}
.dlg>.f{padding:11px 18px;border-top:1px solid #e4e7ed;display:flex;justify-content:flex-end;gap:10px}
</style>
</head>

<div class="hd">
  <h1>Create Offer</h1>
  <div class="ctx" id="ctx"></div>

<div class="foot" id="foot"></div>
<div id="layer"></div>

<script>

/* 当前 Third Party + Track Link Type 组合下该补全 / 替换的参数表（文档 3.8.2 每个组合一张表）
   = 该 MMP 的基础必传参数 + 该 link type 的专属参数（含归因窗口） */
function reqParams() {
  const t = form.tracking, r = MMP_RULES[t.third_party] || {};
  const ext = (r.byType || {})[t.track_link_type] || {};
  const base = (r.required || []).map((x) => Object.assign({}, x));
  /* engaged click / engaged view 的 clickid 取 extend_clickid */
  if (ext.clickid) base.forEach((x) => { if (x.k === 'clickid') x.v = ext.clickid; });
  /* 弹窗里手改过的目标值优先 */
  const ov = (t.param_override || {})[t.third_party + '|' + t.track_link_type] || {};
  return base.concat(ext.extra || []).map((x) => (ov[x.k] == null ? x : Object.assign({}, x, { v: ov[x.k] })));
}
/* 记下手改的目标值：按 Third Party + Track Link Type 分开存，切换组合不互相干扰 */
function setParamTarget(k, v) {
  const t = form.tracking;
  const key = t.third_party + '|' + t.track_link_type;
  t.param_override = t.param_override || {};
  t.param_override[key] = t.param_override[key] || {};
  t.param_override[key][k] = v;
  openGenerate();
}

/* 结算口径派生值。Upstream settles on Adv Settlement Type 取，下游按 Channel Settlement Type 取，
   两边各自可能落在 install 或某个 event 上，所以统一从这里读，避免各处口径不一致 */
/* 对下游只有一个结算配置：Channel 侧固定一行，Event Name 由 Channel Set Type 决定，只允许填 payout 与对外 Note */
/* Channel 表 Event Name 的默认值：CPI 取 install，CPE 取 Adv 表第二行，CPS 取第一行 */
function chnEventName() {
  const s = form.settle;
  if (s.chn_settle_type === 'cpi') return 'install';
  const opts = chnEventOpts();
  const pref = s.chn_settle_type === 'cps' ? s.adv_events[0] : s.adv_events[1];
  if (pref && opts.some((x) => x.name === pref.name)) return pref.name;
  return (opts[0] || {}).name || 'install';
}
/* Adv 表的 Install 行由口径组合决定：该有就补到首行，不该有就摘掉；Channel 侧固定一行 */
function syncSettle() {
  const s = form.settle;
  /* Adv=CPS 时下游不支持 CPI，Channel 停在 CPI 就落到 CPE */
  if (s.adv_settle_type === 'cps' && s.chn_settle_type === 'cpi') s.chn_settle_type = 'cpe';
  const idx = s.adv_events.findIndex((x) => x.name === 'install');
  if (hasInstallRow()) {
    /* 口径切回来时优先用缓存，避免已填的价格 / 匹配规则丢失 */
    if (idx < 0) s.adv_events.unshift(s._installCache || { name:'install', real:null, match:'uniq', window:'lifetime' });
    else if (idx > 0) s.adv_events.unshift(s.adv_events.splice(idx, 1)[0]);
  } else if (idx >= 0) {
    s._installCache = s.adv_events[idx];
    s.adv_events.splice(idx, 1);
  }
  /* 除 install 外至少保留一行，否则 CPE / CPS 没有可结算的 event */
  if (!onlyInstall() && !s.adv_events.some((x) => x.name !== 'install'))
    s.adv_events.push({ name:'af_purchase', real:null, match:'uniq', window:'7d' });
  syncChnEvents();
}
/* Channel 表的 Adv Price / Channel Payout 初始值：取该 event 在 Adv 表里的价格 * 0.8 */
function defaultChnPrice(name) {
  const e = form.settle.adv_events.find((x) => x.name === name);
  if (!e || e.real == null) return null;
  return Math.round(e.real * 0.8 * 1000) / 1000;
}
function syncChnEvents() {
  const s = form.settle, o = s.chn_events[0] || {};
  const name = chnEventName();
  /* 首次渲染与结算 event 变更时按默认公式回填；用户手工改过的值不再覆盖 */
  const reset = o._init !== true || o.name !== name;
  const def = reset ? defaultChnPrice(name) : null;
  s.chn_events = [{ name: name,
    adv_price: reset ? def : o.adv_price,
    payout: reset ? def : o.payout,
    note: o.note || '', _init: true }];
}
/* 结算行：上游 / 下游各自按自己的口径认定哪一行参与结算 */
/* Install 行是否存在：Adv=CPI 恒有；Adv=CPE 仅在 Channel=CPI 时有；Adv=CPS 没有 */
const hasInstallRow = () => {
  const s = form.settle;
  return s.adv_settle_type === 'cpi' || (s.adv_settle_type === 'cpe' && s.chn_settle_type === 'cpi');
};
/* CPI/CPI 时 Adv 表只展示 install 一行，也不给增删入口 */

/* Adv 表实际渲染出来的行 */

  const s = form.settle;
  if (onlyInstall()) return s.adv_events.filter((x) => x.name === 'install');
  return s.adv_events.filter((x) => x.name !== 'install' || hasInstallRow());
};
/* Adv Real Price 可填：CPI 只有 install 行可填，CPE 只有非 install 行可填，CPS 全可填 */

/* Channel 表两列各自独立判定（文档 3.5 交互场景 1-6）：
   Adv Price   —— 上游按 CPS 分成时不在这里填，展示 - 并置灰（场景 5、6）

    else { a = a.filter((x) => !ex.includes(x)); if (!a.includes(k)) a.push(k); }
  } else a = a.filter((x) => x !== k);
  setv(path, a); render();
}

/* ============================================================
   Offer Name ⇄ UUID 互转与重名推荐
   调研反馈：两个字段纯手填，既慢又容易撞名；uuid 尾号撞了只能一个个试。
   规则：name 与 uuid 是大小写 + 分隔符的映射，转换后仍可手工改。
   ============================================================ */
function nameToUuid(name) {
  return String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
function uuidToName(uuid) {
  return String(uuid || '').replace(/_+/g, ' ').trim().toUpperCase();
}
/* 一个按钮双向生成：哪边填了就补另一边，两边都填以 Offer Name 为准重算 uuid */
function autoNameUuid() {
  const b = form.basic;
  if (b.offer_name) return syncUuid();
  if (b.offer_uuid) return syncName();
  toast('Fill either Offer Name or Offer UUID first', 'warn');
}
const nameDup = (n) => !!n && EXIST_NAMES.some((x) => x.toLowerCase() === String(n).toLowerCase());
const uuidDup = (u) => !!u && EXIST_UUIDS.some((x) => x.toLowerCase() === String(u).toLowerCase());
/* 尾号推荐：把结尾数字往后推到第一个没被占用的值，省掉「11 占了改 12、12 又占了改 13」的反复试 */
function nextFree(val, taken) {
  const m = String(val).match(/^(.*?)(\d+)$/);
  if (!m) return null;
  const pre = m[1];
  let n = +m[2];
  const has = (v) => taken.some((x) => x.toLowerCase() === v.toLowerCase());
  for (let i = 0; i < 200; i++) { n++; if (!has(pre + n)) return pre + n; }
  return null;
}
/* Offer Name → UUID。写 uuid 的同时把 name 侧的重名问题一起暴露出来 */
function syncUuid() {
  const b = form.basic;
  if (!b.offer_name) return toast('Fill Offer Name first', 'warn');
  let u = nameToUuid(b.offer_name);
  if (uuidDup(u)) {
    const nx = nextFree(u, EXIST_UUIDS);
    if (nx) { toast('uuid ' + u + ' already exists, bumped to ' + nx, 'warn'); u = nx; }
  }
  const prevU = b.offer_uuid;
  b.offer_uuid = u;
  pushLog('Basic Info', 'Offer UUID', prevU, u);
  render();
}
function syncName() {
  const b = form.basic;
  if (!b.offer_uuid) return toast('Fill Offer UUID first', 'warn');
  const prevN = b.offer_name;
  b.offer_name = uuidToName(b.offer_uuid);
  pushLog('Basic Info', 'Offer Name', prevN, b.offer_name);
  render();
}
/* now：把当前时间写进开始时间，精确到秒 */
function promoteNow() {

  form.basic.promote_start = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
    + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());

}
/* 粘贴进来的 channel uuid 可能用英文逗号或空格分隔，失焦时统一拆成一行一个 */
function splitChannels() {

/* ============================================================
   三级 Geo 引擎：国家 → Region(州/省) → City
   数据结构对齐 mob_camp_info：
     region = {国家: {region_id: 'all' | [city_id,...]}}
     city   = {国家: [city_id,...]}，等于 region 各数组按 key 顺序拍平
   这里让 city 由 region 派生而非独立存储，从结构上消灭「region 与 city 口径不一致」——
   那是现网最常见也最危险的一类脏数据。
   ============================================================ */
let g3 = { country: 'BR', rid: null, qCountry: '', qRegion: '', qCity: '' };

/* ---- 懒加载：点上一层级的具体值，才把下一层级字典拉出来，并且默认全选 ---- */
function loadRegions(c) {
  const t = form.target;
  const m = t.region[c] = t.region[c] || {};
  regionsOf(c).forEach((r) => { if (m[r.rid] === undefined) m[r.rid] = 'all'; });
  t.loadedR[c] = 1;
}
function loadCities(c, rid) {
  const t = form.target;
  const m = t.region[c] = t.region[c] || {};
  if (m[rid] === undefined || (Array.isArray(m[rid]) && !m[rid].length)) m[rid] = 'all';   /* 拉出来默认全选 */
  t.loadedC[c + '|' + rid] = 1;
}
/* ---- 勾选与下钻 ---- */
function pickCountry(c, v) {
  const t = form.target, a = t.countries, i = a.indexOf(c);
  if (v && i < 0) { a.push(c); loadRegions(c); g3.country = c; g3.rid = null; }
  if (!v && i >= 0) { a.splice(i, 1); delete t.region[c]; delete t.loadedR[c]; }
  render();
}
function openCountry(c) {
  const t = form.target;
  g3.country = c; g3.rid = null; g3.qRegion = ''; g3.qCity = '';
  if (!t.countries.includes(c)) { t.countries.push(c); loadRegions(c); }
  else if (!t.loadedR[c]) loadRegions(c);
  render();
}
function pickRegion(c, rid, v) {
  const m = form.target.region[c] = form.target.region[c] || {};
  if (v) {
    m[rid] = 'all';
    /* 勾选即把这个 region 的 city 拉到第三栏，和点击行的效果一致 */
    g3.rid = rid; g3.qCity = '';
    form.target.loadedC[c + '|' + rid] = 1;
  } else {
    m[rid] = [];            /* 取消勾选：保留 key，城市列表仍展示但全部未勾 */
  }
  render();
}
function openRegion(c, rid) {
  const m = form.target.region[c] = form.target.region[c] || {};
  g3.rid = rid; g3.qCity = '';
  /* 与点国家行一致：点到一个没选中的 region，就把它下面的 city 拉出来并全选 */
  if (m[rid] === undefined || (Array.isArray(m[rid]) && !m[rid].length)) m[rid] = 'all';
  form.target.loadedC[c + '|' + rid] = 1;
  render();
}
function pickCity(c, rid, id, v) {
  const m = form.target.region[c] = form.target.region[c] || {};
  const r = regionById(c, rid); if (!r) return;
  const all = r.cities.map((x) => x.id);
  let arr = m[rid] === 'all' ? all.slice() : (Array.isArray(m[rid]) ? m[rid].slice() : []);
  const i = arr.indexOf(id);
  if (v && i < 0) arr.push(id);
  if (!v && i >= 0) arr.splice(i, 1);
  /* 子层级一个都没取消就回到整州，新增城市自动覆盖 */
  m[rid] = arr.length === all.length ? 'all' : arr;
  render();
}
/* ---- 右侧选中情况标签：子层级没单独取消就标全选，否则给 已选/总数 ---- */
/* 评审反馈：去掉 Target 模块的标签计算（whole 类标签与 N/M 计数都不要），
   选中范围改由各层级复选框的全选 / 半选态体现 */
function cityLabel() { return ''; }
function regionLabel(c) {
  const t = form.target;
  if (!t.countries.includes(c)) return '';
  if (!t.loadedR[c]) return '<span class="gray">not loaded</span>';
  return '';
}
/* 某个 region 的选择态：all = 全选、有城市 = 半选、其余 = 未选 */
function regionCheckState(c, rid) {
  const v = (form.target.region[c] || {})[rid];
  if (v === 'all') return 'all';
  return (v || []).length ? 'part' : 'none';
}

const regionsOf = (c) => ((GEO_DATA[c] || {}).regions || []);
const regionById = (c, rid) => regionsOf(c).find((r) => String(r.rid) === String(rid));

/* 某州已选城市数；'all' 按该州真实城市总数计 */
function stateCount(c, rid) {
  const v = (form.target.region[c] || {})[rid];
  if (v === 'all') { const r = regionById(c, rid); return r ? r.total : 0; }
  return (v || []).length;
}
function stateMode(c, rid) {
  const v = (form.target.region[c] || {})[rid];
  if (v === 'all') return 'all';
  if (v && v.length) return 'part';
  return 'none';
}
/* 州 id 按州名字母序排列。
   注意不能依赖对象的 key 顺序：JS（以及 MySQL 的 JSON 类型）会把整数样式的 key
   按数值升序重排，排序约定会被吃掉。所以顺序单独用数组维护，落库字符串手工拼。 */
function orderedRids(c) {
  const m = form.target.region[c] || {};
  return Object.keys(m).filter((rid) => m[rid] === 'all' || (m[rid] || []).length)
    .sort((a, b) => {
      const ra = regionById(c, a), rb = regionById(c, b);
      return String(ra ? ra.name : a).localeCompare(String(rb ? rb.name : b));
    });
}
function sortedCities(c, rid, arr) {
  const r = regionById(c, rid), names = {};
  (r ? r.cities : []).forEach((x) => { names[x.id] = x.name; });
  return arr.slice().sort((a, b) => String(names[a] || a).localeCompare(String(names[b] || b)));
}
/* region JSON：key 按州名字母序，数组内按城市名字母序（现网排序约定） */
function buildRegionJSON() {
  const out = {};
  form.target.countries.forEach((c) => {
    const m = form.target.region[c] || {}, keys = orderedRids(c);
    if (!keys.length) return;
    out[c] = {};
    keys.forEach((rid) => { out[c][rid] = m[rid] === 'all' ? 'all' : sortedCities(c, rid, m[rid]); });
  });
  return out;
}
/* 落库用的字符串：手工拼接以保住 key 顺序，不走 JSON.stringify(对象) */
function regionJSONString(pretty) {
  const parts = [];
  form.target.countries.forEach((c) => {
    const m = form.target.region[c] || {}, keys = orderedRids(c);
    if (!keys.length) return;
    const inner = keys.map((rid) => JSON.stringify(rid) + ':'
      + (m[rid] === 'all' ? '"all"' : JSON.stringify(sortedCities(c, rid, m[rid]))));
    parts.push(JSON.stringify(c) + ':{' + (pretty ? '\n    ' + inner.join(',\n    ') + '\n  ' : inner.join(',')) + '}');
  });
  return '{' + (pretty ? '\n  ' + parts.join(',\n  ') + '\n' : parts.join(',')) + '}';
}
/* city JSON：region 各数组按 key 顺序拍平。'all' 展开为该州全部城市 */
function buildCityJSON() {
  const out = {};
  form.target.countries.forEach((c) => {
    const m = form.target.region[c] || {}, keys = orderedRids(c);
    if (!keys.length) return;
    const arr = [];
    keys.forEach((rid) => {
      if (m[rid] === 'all') {
        const r = regionById(c, rid);
        (r ? r.cities : []).forEach((x) => arr.push(x.id));   /* 原型只含样例城市 */
      } else sortedCities(c, rid, m[rid]).forEach((x) => arr.push(x));
    });
    out[c] = arr;
  });
  return out;
}
function geoTotals() {
  let states = 0, cities = 0;
  form.target.countries.forEach((c) => orderedRids(c).forEach((rid) => { states++; cities += stateCount(c, rid); }));
  return { countries: form.target.countries.length, states, cities };
}

/* 定向校验。按真实排查中反复出现的问题设计 */
function geoIssues() {
  const t = form.target, out = [];
  if (!t.countries.length) out.push({ level:'err', msg:'Target Geo is required: select at least one country' });
  t.countries.forEach((c) => {
    const m = t.region[c] || {};
    const has = Object.keys(m).some((rid) => m[rid] === 'all' || (m[rid] || []).length);
    if (!has) out.push({ level:'warn', msg: CNAME[c] + '（' + c + ') is in Target Geo without any Region / City, so it runs nationwide' });
    /* all 州不得再单列城市 */
    Object.keys(m).forEach((rid) => {
      if (m[rid] === 'all') return;
      const r = regionById(c, rid);
      if (r && (m[rid] || []).length === r.total)
        out.push({ level:'warn', msg: (r ? r.name : rid) + ' has every city selected one by one; switch to the whole-region option so newly added cities are covered automatically' });
    });
    /* 一地多码：选了别名中的一个却漏了另一个 */
    Object.keys(m).forEach((rid) => {
      if (m[rid] === 'all') return;
      const r = regionById(c, rid); if (!r) return;
      const picked = new Set(m[rid] || []);
      const nameOf = {}; r.cities.forEach((x) => { nameOf[x.id] = x.name; });
      CITY_ALIAS.forEach((al) => {
        const ids = al.pair.map((n) => (r.cities.find((x) => x.name === n) || {}).id).filter(Boolean);
        if (ids.length !== 2) return;
        const on = ids.filter((id) => picked.has(id));
        if (on.length === 1) {
          const missName = nameOf[ids.find((id) => !picked.has(id))];
          out.push({ level:'warn', msg:'selected ' + nameOf[on[0]] + ' selected but the alias code for the same place is not: ' + missName + '。' + al.note });
        }
      });
    });
  });
  return out;
}

/* ---------- 三级选择器渲染：国家 / Region / City 三栏一体 ----------
   国家不再单独放一个复选框模块，而是作为级联的第一栏：

    + '<div class="cb">'

          + '<b>' + c + '</b><span class="gray">' + esc(n) + '</span></label>'
          + '<span class="mt">' + regionLabel(c) + '</span></div>';
      }).join('') : '<div class="gi gray">No matching country</div>')
    + '</div></div>';

  /* ---- Region：点国家才加载，加载即全选；点击行下钻并加载 city ---- */
  const rs = regionsOf(cc);
  const regs = rs.filter((r) => !qr || r.name.includes(qr));
  const loadedR = !!t.loadedR[cc];
  h += '<div><div class="ch"><span>Region</span>'
    /* 评审反馈：region 选择器右上角单独一个开关 */
    + '<label class="chk" style="margin:0;font-size:11px;white-space:nowrap" title="取消B类渠道Region和City定向限制">'

  else h += regs.map((r) => {
      /* 全选打勾、部分选中给半选态，取代原来的 Whole Region / N/M city 标签 */
      const st = regionCheckState(cc, r.rid);
      return '<div class="gi' + (curR && String(curR.rid) === String(r.rid) ? ' on' : '') + '" onclick="openRegion(\'' + cc + '\',\'' + r.rid + '\')">'
        + '<label class="chk" style="margin:0;flex:1" onclick="event.stopPropagation()">'
        + '<input type="checkbox" ' + (st !== 'none' ? 'checked' : '') + (st === 'part' ? ' data-ind="1"' : '')
        + ' onchange="pickRegion(\'' + cc + '\',\'' + r.rid + '\',this.checked)">'
        + '<span class="nm">' + esc(r.name) + '</span></label>'
        + '<span class="mt">' + cityLabel() + '</span></div>';
    }).join('');
  h += '</div></div>';

  /* ---- City：最低层级，只勾选不展示子层级情况 ---- */
  if (curR && !t.loadedC[cc + '|' + curR.rid]) loadCities(cc, curR.rid);
  const loadedC = !!curR;
  const cities = curR ? curR.cities.filter((x) => !qy || x.name.includes(qy)) : [];
  const picked = curR ? (m[curR.rid] === 'all' ? curR.cities.map((x) => x.id) : (m[curR.rid] || [])) : [];
  h += '<div><div class="ch"><span>City</span>'

    + '</div>'
    + '<input class="srch" placeholder="Search city name" value="' + esc(g3.qCity) + '" oninput="g3.qCity=this.value;render()">'
    + '<div class="cb">';
  if (!curR) h += '<div class="gi gray">Click a region in the middle to load its cities</div>';

  else {
    h += cities.map((x) => '<div class="gi"><label class="chk" style="margin:0;flex:1">'

      + esc(x.name) + '</label><span class="mt mono gray">' + x.id + '</span></div>').join('');

  }
  h += '</div></div>';

  h += '</div>';
  return h;
}

/* ============================================================
   Tracking Link 引擎：解析 / 组装 / 自动生成 / 校验 / 宏渲染
   纯函数，便于脚本单独验证
   ============================================================ */
/* Math Random 表达式：现网用它在多个域名 / pid 之间随机，规避单点限流。
   形如 {@(['a','b'][parseInt(Math.random()*2)])@}，既可能出现在 host 也可能出现在参数值里 */
const RAND_RE = /\{@\(\[[^\]]*\]\[parseInt\(Math\.random\(\)\*\d+\)\]\)@\}/;
const isRand = (s) => RAND_RE.test(String(s || ''));
/* Math Random 默认 key：随 Third Party 整套切换，key 不可编辑 */
const RAND_DIMS_AF = {
  domain:   { name:'Domain',   ph:'多个值用英文逗号分隔，如 go.onelink.me/S8mj,shorttv.onelink.me/FOV6', target:'host' },
  agency:   { name:'Agency',   ph:'多个值用英文逗号分隔，如 Mobvista,NativeX', target:'af_prt' },
  pid:      { name:'Pid',      ph:'多个值用英文逗号分隔，如 mobvista_int,nativex_int', target:'pid' },

function runGenerate() {
  const t = form.tracking, a = form.adv, r = MMP_RULES[t.third_party] || {};
  const p = parseLink(t.adv_link);
  if (!p.ok) return toast('Adv Link cannot be parsed; check for a missing https://', 'err');
  const rows = randRows();
  /* 勾了但没填值 / 自定义行没填 key，阻塞提示，避免生成出一条看似成功但没随机的链接 */
  /* 自定义行填了候选值却没填 Key，这行数据无处可写，拦下来而不是静默丢弃 */
  const bad = [];
  (t.rand_custom || []).forEach((row, i) => {
    if (randVals(row.raw).length && !(row.key || '').trim()) bad.push('第 ' + (i + 1) + ' 行');
  });
  if (bad.length) return toast('Math Random 自定义行填了候选值但缺 Key：' + bad.join('、'), 'err');
  /* event_token 与 event_name 必须同时填写，半截行拦下不生成（文档 3.8.2 Event 映射校验） */
  if (t.third_party === 'adjust' && adjEventHalf().length)
    return toast('Add adjust event 有 ' + adjEventHalf().length + ' 行只填了 token 或 name，需同时填写', 'err');
  /* 域名按 Third Party + Track Link Type 的要求纠正（vta 走 impression / view 域名等） */
  const wantHost = wantHostOf('click');
  if (wantHost && p.host !== wantHost) p.host = wantHost;
  /* Domain 行替换 host，其余行写到同名参数上 */
  const dm = rows.filter((x) => x.key === 'host')[0];
  if (dm) p.host = randExpr(dm.vals);
  if (!p.path && r.path_rule === 'bundle') p.path = primaryOS() === 'ios' ? ('id' + (a.app_id || '')) : a.package_name;
  const has = {};
  p.params.forEach((x, i) => { has[x.k] = i; });
  /* 按参数表补全 / 替换：mode=fill 的只在缺失时补，其余要求值与目标一致，不一致就替换 */
  reqParams().forEach((x) => {
    if (x.os && x.os !== primaryOS()) return;
    if (has[x.k] == null) { p.params.push({ k:x.k, v:x.v }); has[x.k] = p.params.length - 1; }
    else if (x.mode !== 'fill' && p.params[has[x.k]].v !== x.v) p.params[has[x.k]].v = x.v;
  });

  let nEvt = 0;
  if (t.third_party === 'adjust') {
    const isGo = /go\.link/.test(p.host || '');
    adjEventRows().forEach((e) => {
      const k = adjEventParam(e.token, isGo), v = adjEventValue(e.name);

  rows.forEach((x) => {

    if (has[x.key] != null) p.params[has[x.key]].v = randExpr(x.vals);
    else { p.params.push({ k:x.key, v:randExpr(x.vals) }); has[x.key] = p.params.length - 1; }

  if (form.basic.is_reactivation === 'rt' && has.is_retargeting == null) p.params.push({ k:'is_retargeting', v:'true' });

  t.tracking_link = buildLink(p);
  pushLog('Tracking Info', 'Tracking Link'
    + (rows.length ? '（Math Random ' + rows.length + ' 行）' : '')
    + (nEvt ? '（event callback ' + nEvt + ' 条）' : ''), prevLink, t.tracking_link);

function validateLink(url, kind) {

  const push = (level, msg, fix) => out.push({ level, msg, fix: fix || null });
  if (!url) { if (kind === 'click') push('err', LINK_ERR.empty, 'auto'); return out; }
  const p = parseLink(url);
  if (!p.ok) { push('err', 'Link cannot be parsed; check for a missing https:// or extra spaces'); return out; }
  if (p.scheme !== 'https') push('err', LINK_ERR.scheme(p.scheme));
  const wantHost = kind === 'view' ? r.view_host : r.click_host;
  if (isRand(p.host)) push('warn', 'Host uses Math Random (' + randPool(p.host).length + ' candidates); host check skipped. '
    + 'Make sure every candidate domain is registered with the MMP, otherwise those clicks are dropped');
  else if (wantHost && p.host !== wantHost) push('err', LINK_ERR.host(p.host, wantHost, MMPS[t.third_party]));
  if (r.path_rule === 'bundle') {
    const want = primaryOS() === 'ios' ? ('id' + (a.app_id || '')) : a.package_name;
    if (!p.path) push('err', LINK_ERR.path_empty);
    else if (primaryOS() === 'android' && p.path !== a.package_name) push('err', LINK_ERR.path_bundle(p.path, want));
  }
  const bad = [];
  p.params.forEach((x) => {
    if (isRand(x.v)) return;   /* Math Random 表达式合法，不按宏校验 */
    (String(x.v).match(/\{@[^}]*@\}/g) || []).forEach((m) => {
      if (!MACRO_SET.has(m) && bad.indexOf(m) < 0) bad.push(m);
    });
  });
  bad.forEach((m) => push('err', LINK_ERR.macro(m), 'macro'));
  p.params.forEach((x) => {
    if (isRand(x.v)) push('warn', 'param ' + x.k + ' uses Math Random (' + randPool(x.v).length + ' candidates), '
      + 'candidates must match what is registered with the MMP, otherwise attribution is dropped');
  });
  const has = new Set(p.params.map((x) => x.k));
  const missing = reqParams().filter((x) => (!x.os || x.os === primaryOS()) && !has.has(x.k)).map((x) => x.k);
  if (missing.length) push('err', LINK_ERR.missing(missing), 'fill');
  const emptyVals = p.params.filter((x) => x.k && !x.v).map((x) => x.k);
  if (emptyVals.length) push('warn', LINK_ERR.empty_val(emptyVals));
  p.params.forEach((x) => {
    const def = reqParams().concat(r.optional || []).find((y) => y.k === x.k);
    if (def && def.os && def.os !== primaryOS()) push('warn', LINK_ERR.os_mismatch(x.k, def.os));
  });
  if (t.is_agency && r.agency_param && !has.has(r.agency_param))
    push('warn', 'Agency clients must carry ' + r.agency_param + ', and the value must be whitelisted on the MMP side');
  if (t.track_way === 's2s' && !has.has('af_ua') && t.third_party === 'appsflyer')
    push('warn', 'With Track Way = S2S, af_ua / af_ip are recommended; otherwise device info is incomplete');
  return out;
}

    if (x.m === '{@info.country@}' && ctx.geo) v = ctx.geo;
    if (x.m === '{@info.country@}' && ctx.country) v = ctx.country;
    s = s.split(x.m).join(v);
  });
  return s.split('{name}').join(ctx.name || 'OFFER_NAME');
}
function classifyParam(k) {
  const r = MMP_RULES[form.tracking.third_party] || {};
  if (reqParams().some((x) => x.k === k)) return 'required';
  if ((r.optional || []).some((x) => x.k === k)) return 'optional';
  return 'custom';
}
/* 3.8.3 的逐行提醒：命中即在 Description 列红字展示，优先于参数含义 */
function paramNote(x, p, i) {
  const k = String(x.k || ''), v = String(x.v || '');
  if (p.params.some((y, j) => j !== i && y.k === k)) return 'Tracking link 中存在重复参数';
  if (/[\s\n]/.test(k) || /[\s\n]/.test(v)) return '存在换行符/空格';
  if (/[A-Z]/.test(k)) return 'Link 中参数含英文大写字母，请检查';
  const braces = (v.match(/\{/g) || []).length !== (v.match(/\}/g) || []).length
    || (/\{/.test(v) && !/\{@[\s\S]*@\}/.test(v));
  if (braces) return '占位符 {} 不完整';
  if (/Math\.random/.test(v)) {
    /* 随机表达式整段当一个值，只检查数组长度与下标是否对得上 */
    const arr = (v.match(/\[([^\]]*)\]/) || [, ''])[1].split(',').filter((s) => s.trim()).length;
    const n = +((v.match(/Math\.random\(\)\s*\*\s*(\d+)/) || [, 0])[1]);
    return arr && n && arr !== n ? '随机函数有误，请检查' : '';
  }
  const m = v.match(/\{@[^}]*@\}/);
  if (m && !MACRO_SET.has(m[0])) return '非系统支持的占位符或占位符有误';
  /* 必传参数传值校验：设备 id 与 clickid 必须用对应的宏 */
  if (k === 'clickid' && v && !/^\{@info\.(extend_)?clickid(\(\))?@\}$/.test(v))
    return 'Tracking link 必传参数 clickid 传值有误，请检查';
  if ((k === 'idfa' || k === 'advertising_id' || k === 'gps_adid') && v && !/query_idfa/.test(v))
    return 'Tracking link 必传参数设备 id 传值有误，请检查';
  return '';
}

/* ============================================================
   单条 Offer 汇总：把各模块的值收成一条记录，供预览、底部校验与创建使用
   ============================================================ */
function buildOffer() {
  const b = form.basic, t = form.target, c = form.cap;
  const region = buildRegionJSON(), city = buildCityJSON();
  let states = 0, cities = 0;
  t.countries.forEach((k) => orderedRids(k).forEach((rid) => { states++; cities += stateCount(k, rid); }));
  const url = form.tracking.tracking_link, lk = form.tracking.link_type;
  const ar = advRealPrice(), cp = chnPrice();
  const advCap = capVal(c.adv_conv_cap), chnCap = capVal(c.chn_conv_cap);
  const issues = validateLink(url, 'click');
  if (chnPayoutOn() && !(cp > 0)) issues.push({ level:'err', msg:'Channel payout is empty or not greater than 0' });
  if (uuidDup(b.offer_uuid)) issues.push({ level:'err', msg:'Offer UUID ' + b.offer_uuid + ' already exists' });
  if (nameDup(b.offer_name)) issues.push({ level:'err', msg:'Offer Name ' + b.offer_name + ' already exists' });
  if (chnCap != null && advCap != null && +chnCap > +advCap)
    issues.push({ level:'warn', msg:'Channel Cap is higher than Adv Cap; the excess cannot be billed to the advertiser' });
  if (t.countries.length > 1) issues.push({ level:'warn', msg:'Package pass-through needs a single Target Geo, so it is unavailable for multi-geo offers' });
  if (lk === 'deeplink' && b.is_reactivation !== 'rt')
    issues.push({ level:'warn', msg:'Link Type = Deeplink is usually used with retargeting, but Budget type is set to UA' });
  return { name:b.offer_name, uuid:b.offer_uuid, countries:t.countries.slice(), link_type:lk,
    advPrice:ar, price:cp, advCap:advCap, cap:chnCap,
    url:url, region:region, city:city, states:states, cities:cities, issues:issues };
}
const errCount = (o) => o.issues.filter((i) => i.level === 'err').length;

/* 各模块必填校验，驱动右侧导航的状态标签 */
function secErrors(k) {
  const e = [];
  if (k === 'adv') {
    if (!form.adv.related_campaign) e.push('Related Campaign is required');
    if (!(form.adv.invoices || []).length) e.push('Related Invoice is required');
    if (!form.adv.advertiser) e.push('Advertiser is required');
  }
  if (k === 'basic') {
    if (!form.basic.offer_name) e.push('Offer Name is required');
    if (!form.basic.offer_uuid) e.push('Offer UUID is required');
    if (nameDup(form.basic.offer_name)) e.push('Offer Name already exists');
    if (uuidDup(form.basic.offer_uuid)) e.push('Offer UUID already exists');
    if (!form.basic.pm) e.push('PM is required');
    if (!form.basic.bd) e.push('BD is required');
  }
  if (k === 'settle') {
    const st = form.settle;
    advShownRows().forEach((x) => {
      if (!x.name) e.push('Event Name in the Set Info table cannot be empty');
      if (advPriceOn(x) && !(x.real > 0))
        e.push((st.adv_settle_type === 'cps' ? 'Settlement Rate' : 'Adv Real Price') + ' is required for ' + (x.name || 'the event'));
    });
    if (!advShownRows().length) e.push('Set Info needs at least one event');
    const ce = st.chn_events[0] || {};
    if (chnAdvPriceOn() && !(ce.adv_price > 0)) e.push('Adv Price is required');
    if (chnPayoutOn() && !(chnPrice() > 0)) e.push('Channel Payout is required');
    if (!String(ce.note || '').replace(/<[^>]*>/g, '').trim()) e.push('Note (External) is required');
  }
  if (k === 'cap') {
    const st = form.settle, showAdvCap = st.adv_settle_type === 'cpi' && st.chn_settle_type === 'cpe';
    if (showAdvCap && !form.cap.adv_conv_cap.on && !(form.cap.adv_conv_cap.val > 0)) e.push('Adv Conversion Cap value required when OPEN is off');
    if (!form.cap.chn_conv_cap.on && !(form.cap.chn_conv_cap.val > 0)) e.push('Channel Conversion Cap value required when OPEN is off');
    if (!form.cap.chn_click_cap.on && !(form.cap.chn_click_cap.val > 0)) e.push('Click Cap value required when OPEN is off');
    if (!form.cap.alloc_daily_cap.on && !(form.cap.alloc_daily_cap.val > 0)) e.push('Allocable Daily Cap value required when OPEN is off');
  }
  if (k === 'target') {
    if (!(form.target.platform || []).length) e.push('Platform is required');
    if (!(form.target.device || []).length) e.push('Device is required');
    geoIssues().filter((x) => x.level === 'err').forEach((x) => e.push(x.msg));
  }
  if (k === 'creative') {
    if (!form.creative.pictures.length && !form.creative.videos.length) e.push('Upload at least one picture or video');
  }
  if (k === 'tracking') {
    validateLink(form.tracking.tracking_link, 'click').filter((x) => x.level === 'err').forEach((x) => e.push(x.msg));
    if (form.tracking.async_flow && !form.tracking.store_link) e.push('Store Link is required when Async Flow is on');
  }
  return e;
}
function secWarns(k) {
  if (k === 'target') return geoIssues().filter((x) => x.level === 'warn').map((x) => x.msg);
  if (k === 'tracking') return validateLink(form.tracking.tracking_link, 'click').filter((x) => x.level === 'warn').map((x) => x.msg);
  return [];
}

function runPasteGeo() {
  const c = ($('#pgC') || {}).value, txt = ($('#pgT') || {}).value || '';
  if (!c) return toast('Select a country that has a dictionary first', 'warn');
  const ok = [], noRegion = [], noCity = [];
  rows(txt).forEach((line) => {
    const p = line.split(/[,，\t]/).map((x) => x.trim().toLowerCase()).filter(Boolean);
    if (p.length < 2) return noCity.push(line + '(missing region)');
    const r = regionsOf(c).find((x) => x.name === p[0]);
    if (!r) return noRegion.push(p[0]);
    const city = r.cities.find((x) => x.name === p[1]);
    if (!city) return noCity.push(p.join(','));
    const m = form.target.region[c] = form.target.region[c] || {};
    if (m[r.rid] === 'all') return ok.push(p[1] + '(region already set to all, skipped)');
    const arr = m[r.rid] = Array.isArray(m[r.rid]) ? m[r.rid] : [];
    if (!arr.includes(city.id)) arr.push(city.id);
    ok.push(p[1]);
  });
  closeLayer(); render();
  const msg = 'Parsed ' + ok.length + ''
    + (noRegion.length ? '; unmatched regions: ' + [...new Set(noRegion)].join('、') : '')
    + (noCity.length ? '; unmatched cities: ' + noCity.slice(0, 5).join('、') + (noCity.length > 5 ? ' etc.' + noCity.length + '' : '') : '');
  toast(msg, (noRegion.length || noCity.length) ? 'warn' : '');
}

/* 变更日志：offer 维度所有模块的改动集合 */
/* 变更日志弹窗：文档 3.11 要求六列、分页展示、支持导出 */
function openLog() {
  const total = LOGS.length;
  const pages = Math.max(1, Math.ceil(total / LOG_PAGE_SIZE));
  if (logPage > pages - 1) logPage = pages - 1;
  if (logPage < 0) logPage = 0;
  const from = logPage * LOG_PAGE_SIZE;
  const page = LOGS.slice(from, from + LOG_PAGE_SIZE);
  /* Before / After 可能是一整条 tracking link，列表里截断，完整值挂 title */
  const cell = (v) => {
    const sv = String(v == null ? '' : v);
    if (!sv) return '<span class="gray">—</span>';
    return '<span title="' + esc(sv) + '">' + esc(sv.length > 46 ? sv.slice(0, 46) + '…' : sv) + '</span>';
  };
  $('#layer').innerHTML = '<div class="mask" onclick="if(event.target===this)closeLayer()"><div class="dlg w960">'
    + '<div class="h">Offer Change Log<a onclick="closeLayer()">×</a></div><div class="b">'
    + '<div class="row" style="justify-content:space-between">'
    + '<span class="small gray">All changes made to this offer across modules. The prototype only records actions from the current session.</span>'
    + '<button class="btn sm" onclick="exportLogs()">Export CSV</button></div>'
    + '<table class="t" style="margin-top:10px"><thead><tr>'
    + '<th style="width:142px">Time</th><th style="width:118px">Operator</th><th style="width:120px">Module</th>'
    + '<th style="width:150px">Field</th><th>Before</th><th>After</th></tr></thead><tbody>'
    + (page.length ? page.map((x) => '<tr><td class="small mono">' + esc(x.t) + '</td>'
        + '<td class="small">' + esc(x.who) + '</td>'
        + '<td><span class="tag gray">' + esc(x.sec) + '</span></td>'
        + '<td class="small">' + esc(x.field || '') + '</td>'
        + '<td class="small mono brk">' + cell(x.before) + '</td>'
        + '<td class="small mono brk">' + cell(x.after) + '</td></tr>').join('')
      : '<tr><td colspan="6" class="gray small">No changes yet</td></tr>')
    + '</tbody></table>'
    + '<div class="row" style="margin-top:10px;justify-content:space-between">'
    + '<span class="small gray">' + total + ' records'
    + (total ? '，showing ' + (from + 1) + '-' + (from + page.length) : '') + '</span>'
    + '<span class="row" style="gap:6px">'
    + '<button class="btn sm" ' + (logPage <= 0 ? 'disabled' : '') + ' onclick="logTurn(-1)">Prev</button>'
    + '<span class="small gray">' + (logPage + 1) + ' / ' + pages + '</span>'
    + '<button class="btn sm" ' + (logPage >= pages - 1 ? 'disabled' : '') + ' onclick="logTurn(1)">Next</button>'
    + '</span></div>'
    + '</div><div class="f"><button class="btn" onclick="closeLayer()">Close</button></div></div></div>';
}
function logTurn(d) { logPage += d; openLog(); }
/* 导出：原型里直接生成 CSV 下载，带 BOM 以便 Excel 正确识别中文 */
function exportLogs() {
  const head = ['Time', 'Operator', 'Module', 'Field', 'Before', 'After'];
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [head.join(',')].concat(
    LOGS.map((x) => [x.t, x.who, x.sec, x.field, x.before, x.after].map(q).join(','))).join('\r\n');
  try {
    const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'offer_change_log_' + (form.basic.offer_uuid || 'offer') + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Exported ' + LOGS.length + ' records');
  } catch (e) { toast('Export is not available in this environment', 'err'); }
}

let curSec = SECS[0].k;
function navBadge(k) {
  if (secErrors(k).length) return { t:'Missing', cls:'err' };
  /* 只有 Tracking Link 的校验解析会产出提醒，其余模块不展示 Warning */
  if (k === 'tracking' && secWarns(k).length) return { t:'Warning', cls:'warn' };
  return { t:'Completed', cls:'ok' };
}
function renderNav() {
  $('#nav').innerHTML = '<div class="nt">Modules</div>' + SECS.map((s) => {
    const b = navBadge(s.k);
    return '<a class="ni' + (curSec === s.k ? ' on' : '') + '" onclick="goSec(\'' + s.k + '\')">'
      + esc(s.name)
      + '<span class="bd ' + b.cls + '">' + esc(b.t) + '</span></a>';
  }).join('');
}
function goSec(k) {
  const el = document.getElementById(k);
  if (!el) return;
  window.scrollTo({ top: el.offsetTop - 62, behavior:'smooth' });
  curSec = k; renderNav();
}
function spy() {
  let cur = curSec;
  SECS.forEach((s) => { const el = document.getElementById(s.k); if (el && el.getBoundingClientRect().top <= 140) cur = s.k; });
  if (cur !== curSec) { curSec = cur; renderNav(); }
